<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 Not Found | NetRecon</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page">
    <header class="nav">
      <a href="/" class="brand">
        <span class="brand-name">NetRecon</span>
        <span class="version-tag">v{{ version }}</span>
      </a>
    </header>
    <main class="not-found-box">
      <p class="mono badge badge-amber">HTTP 404</p>
      <h1>Route not found on this host.</h1>
      <p>The requested endpoint or page does not exist. Return to the reconnaissance workbench to run a public audit.</p>
      <a href="/" class="btn-primary">Return to Workbench</a>
    </main>
  </div>
</body>
</html>
